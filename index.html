<!DOCTYPE html>
<html lang="zh-Hans">
<head>

<title>天国身份测验 · Kingdom Identity Quiz</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root{
    --bg1:#0f1638; --bg2:#2a1650; --gold:#e8c26a; --gold2:#f6e3a8;
    --ink:#f7f3e8; --muted:#b9b3d6; --card:rgba(255,255,255,.07); --line:rgba(232,194,106,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:radial-gradient(1200px 800px at 50% -10%,#3b2a74 0%,var(--bg2) 35%,var(--bg1) 100%);color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;}
  body{min-height:100vh;display:flex;flex-direction:column}
  .castle{position:fixed;left:0;right:0;bottom:0;width:100%;height:26vh;opacity:.16;pointer-events:none;z-index:0}
  main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px;text-align:center}
  h1{font-size:clamp(28px,5vw,64px);margin:0;color:var(--gold2);letter-spacing:.04em}
  .en{color:var(--muted);font-size:.55em;display:block;margin-top:6px;font-weight:400;letter-spacing:0}
  .crown{font-size:clamp(36px,6vw,72px)}
  .btn{appearance:none;border:1px solid var(--gold);background:linear-gradient(180deg,#f0cf7d,#c9973b);color:#2a1650;font-weight:700;
    border-radius:14px;padding:14px 22px;font-size:18px;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--gold2)}
  .btn:disabled{opacity:.4;cursor:default}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
  .muted{color:var(--muted)}
  .hidden{display:none!important}
  /* presenter */
  .p-q{font-size:clamp(28px,4.4vw,60px);font-weight:700;max-width:1400px;line-height:1.3}
  .p-q .en{font-size:.5em}
  .p-opts{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:min(1400px,94vw)}
  .p-opt{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 24px;text-align:left;display:flex;gap:18px;align-items:center;font-size:clamp(20px,2.4vw,34px)}
  .letter{flex:none;width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#2a1650;font-weight:800}
  .p-opt .en{font-size:.6em;margin-top:4px}
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;background:rgba(10,12,35,.75);border-top:1px solid var(--line);font-size:16px}
  .progress{color:var(--gold2)}
  .qrbox{background:#fff;border-radius:18px;padding:16px;display:inline-block}
  .qrbox img,.qrbox canvas{display:block;width:min(42vh,420px);height:auto;image-rendering:pixelated}
  .link{font-size:14px;color:var(--muted);word-break:break-all;max-width:90vw}
  .big{font-size:clamp(22px,3vw,40px)}
  .dist{display:grid;gap:12px;width:min(900px,90vw);text-align:left}
  .dist .r{display:grid;grid-template-columns:7em 1fr 3em;gap:12px;align-items:center;font-size:clamp(18px,2.2vw,30px)}
  .dist .track{height:26px;background:rgba(255,255,255,.08);border-radius:13px;overflow:hidden}
  .dist .fill{height:100%;background:linear-gradient(90deg,#c9973b,#f6e3a8);width:0;transition:width .6s}
  .four{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;width:min(1300px,94vw)}
  .four div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 10px;font-size:clamp(22px,2.6vw,38px)}
  .four .ic{font-size:1.6em;display:block}
  /* phone */
  .ph{width:min(520px,100%)}
  .ph-q{font-size:22px;font-weight:700;line-height:1.4;margin:6px 0 16px}
  .ph-q .en{font-size:14px}
  .ph-opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);color:var(--ink);
    border-radius:16px;padding:14px;margin:0 0 12px;font-size:18px;cursor:pointer;font-family:inherit}
  .ph-opt .en{font-size:13px;margin-top:3px}
  .ph-opt.sel{border-color:var(--gold2);background:rgba(232,194,106,.22);box-shadow:0 0 0 3px rgba(232,194,106,.25)}
  .tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--gold2)}
  .result-ic{font-size:84px;line-height:1}
  .result-name{font-size:48px;color:var(--gold2);font-weight:800;margin:4px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:left;line-height:1.6}
  .verse{border-left:3px solid var(--gold);padding-left:12px;margin-top:12px;color:var(--gold2)}
  .verse small{display:block;color:var(--muted);margin-top:4px}
  .note{font-size:13px;color:var(--muted)}
  @media (max-width:700px){.p-opts{grid-template-columns:1fr}.four{grid-template-columns:1fr 1fr}}
</style>
</head>

<script type="module">

/* ============ CONTENT (edit here) ============ */
const QUESTIONS = [
  {zh:"放学／下班回家，你最想要的是？", en:"After school or work, what do you want most?",
   o:[["有人对我说“你今天辛苦了”","Someone telling me “You worked hard today”"],["和一群好朋友待在一起","Hanging out with my friends"],["把事情做好，很有成就感","Getting things done — feels great"],["来一场挑战，而且要赢！","A challenge — and I want to win!"]]},

   o:[["国王是我的爸爸","The king is my dad"],["拿到这个王国的护照","A passport of that kingdom"],["负责管理一座城","To be put in charge of a city"],["加入骑士团","To join the knights"]]},
  {zh:"遇到困难的时候，你通常会？", en:"When things get hard, you usually…",
   o:[["找最亲的人说","Talk to the person closest to me"],["找一群人一起面对","Face it together with a group"],["自己想办法解决","Figure out a solution myself"],["正面迎战","Face it head-on"]]},
  {zh:"你最怕别人对你说什么？", en:"What would you hate most to hear someone say to you?",
   o:[["“没有人爱你”","“Nobody loves you”"],["“你不属于这里”","“You don’t belong here”"],["“你没有用”","“You’re useless”"],["“你是胆小鬼”","“You’re a coward”"]]},
  {zh:"玩游戏的时候，你最常选什么角色？", en:"In games, which role do you usually pick?",
   o:[["王子／公主","Prince / Princess"],["城里的居民","Townsfolk"],["建造者／指挥官","Builder / Commander"],["战士","Warrior"]]},
  {zh:"收到一份礼物，你最在乎的是？", en:"When you get a gift, what matters most?",
   o:[["是谁送给我的","Who gave it to me"],["大家都有，我也有","Everyone got one, and so did I"],["我会好好保管、好好用它","I’ll take care of it and use it well"],["它能让我变得更强","It makes me stronger"]]},
  {zh:"分组做功课／项目时，你通常是？", en:"In a group project, you’re usually…",
   o:[["希望老师（老板）看见我、肯定我","Hoping the teacher (boss) notices me"],["只要和好朋友同一组就好","Happy as long as I’m with my friends"],["负责分工、管时间的那一个","The one who plans and keeps time"],["冲在前面，搞定最难的部分","Up front, tackling the hardest part"]]},
  {zh:"你最喜欢哪一种电影情节？", en:"Which movie plot do you like most?",
   o:[["走失的孩子终于找到爸爸","A lost child finally finds their father"],["主角终于找到属于自己的家","The hero finally finds a home to belong to"],["普通人被托付一个重要的任务","An ordinary person is trusted with a big mission"],["英雄打败大魔王","The hero defeats the final boss"]]},
  {zh:"如果可以选一个超能力，你会选？", en:"If you could pick one superpower…",
   o:[["随时瞬间移动回到最爱的人身边","Teleport to the people I love, anytime"],["听得懂所有语言，到哪里都不是外人","Understand every language — never an outsider"],["一样东西到我手里，就能变成十样","Turn one thing into ten"],["刀枪不入，什么都不怕","Be invincible and fear nothing"]]},
  {zh:"如果有一天你得到很多钱，你会？", en:"If you suddenly got a lot of money, you would…",
   o:[["先和家人分享","Share it with my family first"],["请所有朋友吃饭","Treat all my friends to a meal"],["好好规划，帮助有需要的人","Plan well and help people in need"],["用来对抗不公平的事","Use it to fight injustice"]]},
];
// Option index 0=A 1=B 2=C 3=D → result key
const RESULTS = {
  A:{ic:"👑", zh:"继承人", en:"Heir",
     msg:"天父要你知道：你是他心爱的儿女，是他的继承人。", msgEn:"Your Father wants you to know: you are His beloved child — His heir.",
     verse:"可见，从此以后，你不是奴仆，乃是儿子了；既是儿子，就靠着神为后嗣。", ref:"加拉太书 Galatians 4:7"},
  B:{ic:"🏠", zh:"家人", en:"Family",
     msg:"天父要你知道：你不是外人，你是神家里的人。", msgEn:"You are not an outsider. You belong to God’s family.",
     verse:"这样，你们不再作外人和客旅，是与圣徒同国，是神家里的人了；", ref:"以弗所书 Ephesians 2:19"},
  C:{ic:"🔑", zh:"管家", en:"Steward",
     msg:"天父要你知道：他信任你，你是神百般恩赐的好管家。", msgEn:"Your Father trusts you. You are a good steward of God’s grace.",
     verse:"各人要照所得的恩赐彼此服侍，作神百般恩赐的好管家。", ref:"彼得前书 1 Peter 4:10"},
  D:{ic:"🛡️", zh:"精兵", en:"Soldier",
     msg:"天父要你知道：你是基督耶稣的精兵。", msgEn:"You are a good soldier of Christ Jesus.",
     verse:"你要和我同受苦难，好像基督耶稣的精兵。", ref:"提摩太后书 2 Timothy 2:3"},
};
const LETTERS = ["A","B","C","D"];
const TIE_PREFERENCE = ["D","A","B","C"]; // on a tie, first key in this list wins
const FOOTER = {zh:"其实，这四个身份你全都是！请抬头看讲台。", en:"Actually — you are all four! Look up at the stage."};
/* ============================================ */

const N = QUESTIONS.length;            // steps: 0 lobby, 1..N questions, N+1 results, N+2 finale
const STEP_RESULT = N+1, STEP_FINAL = N+2;
const app = document.getElementById("app"), bar = document.getElementById("bar");
const params = new URLSearchParams(location.search);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mk = (store) => ({
  get(k){ try{ return JSON.parse(store.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ store.setItem(k, JSON.stringify(v)); }catch(e){} }
});
const local = mk(window.localStorage), sess = mk(window.sessionStorage);
const rid = (n=6) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => "abcdefghjkmnpqrstuvwxyz23456789"[b % 31]).join("");

function computeResult(answers){
  const t = {A:0,B:0,C:0,D:0}; let n = 0;
  for (const k in answers){ const v = answers[k]; if (v>=0 && v<4){ t[LETTERS[v]]++; n++; } }
  if (!n) return null;
  const max = Math.max(t.A,t.B,t.C,t.D);
  return TIE_PREFERENCE.find(k => t[k]===max);
}

/* ---------- backend: Firebase Realtime Database (or a test stand-in) ---------- */
async function connectBackend(){
  if (window.TEST_BACKEND) return window.TEST_BACKEND();
  if (!FIREBASE_CONFIG.databaseURL || FIREBASE_CONFIG.databaseURL.includes("PASTE")) throw new Error("config");
  const V = "10.12.2";
  const fa = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const fd = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-database.js`);
  const db = fd.getDatabase(fa.initializeApp(FIREBASE_CONFIG));
  const r = p => fd.ref(db, p);
  return {
    set: (p, v) => fd.set(r(p), v),
    remove: p => fd.remove(r(p)),
    watch: (p, cb) => fd.onValue(r(p), s => cb(s.val())),
    onConn: cb => fd.onValue(r(".info/connected"), s => cb(s.val() === true)),
    presence: p => fd.onValue(r(".info/connected"), s => {
      if (s.val() === true) fd.onDisconnect(r(p)).remove().then(() => fd.set(r(p), true)).catch(()=>{});
    }),
  };
}
const ROOT = sid => "kq/" + sid;
const count = o => o ? Object.keys(o).length : 0;

/* ---------- landing ---------- */
function landing(){
  app.innerHTML = `
    <div class="crown">👑</div>
    <h1>天国身份测验<span class="en">Kingdom Identity Quiz</span></h1>
    <p class="muted">讲员请按下方按钮，在投影屏幕上开始。<br><span style="font-size:14px">Presenter: open this on the projected screen and start below.</span></p>
    <div class="row">
      <button class="btn" id="startHost">我是讲员 · Start as presenter</button>
      <button class="btn ghost" id="solo">自己做 · Try it alone</button>
    </div>`;
  document.getElementById("startHost").onclick = () => { location.search = "?host"; };
  document.getElementById("solo").onclick = () => { location.search = "?solo"; };
}

function configError(){
  app.innerHTML = `<div class="ph"><h1 style="font-size:28px">⚠️ 还没设定 Firebase<span class="en">Firebase settings are missing</span></h1>
    <p class="note">请把 Firebase 设定贴进 index.html 最上面的 FIREBASE_CONFIG。<br>Paste your Firebase settings into FIREBASE_CONFIG at the top of index.html.</p></div>`;
}

/* ---------- presenter ---------- */
async function presenter(){
  let sid = local.get("kq_sid");
  if (!sid) { sid = rid(); local.set("kq_sid", sid); }
  let step = 0, online = false, joined = 0, answers = {}, results = {}, be = null, gotStep = false;

  const joinUrl = () => location.origin + location.pathname + "?join=" + encodeURIComponent(sid);
  function setStep(s){
    step = Math.max(0, Math.min(STEP_FINAL, s));
    if (be) be.set(ROOT(sid) + "/step", step);
    render();
  }
  function newSession(){
    if (!confirm("开始新场次？所有人需要重新扫描 QR。\nStart a new session? Everyone will need to scan the new QR.")) return;
    sid = rid(); local.set("kq_sid", sid); location.reload();
  }
  function qrHtml(){
    if (typeof qrcode === "undefined") return `<div class="qrbox" style="color:#2a1650;padding:30px">QR 载入失败<br>QR failed to load</div>`;
    const q = qrcode(0, "M"); q.addData(joinUrl()); q.make();
    return `<div class="qrbox">${q.createImgTag(10, 0)}</div>`;
  }

  function render(){
    if (step === 0) {
      app.innerHTML = `
        <h1>天国身份测验<span class="en">Kingdom Identity Quiz</span></h1>
        <p class="big">用手机扫描 QR 码加入<span class="en">Scan with your phone camera to join</span></p>
        ${qrHtml()}
        <div class="link">${esc(joinUrl())}</div>
        <p class="big progress">已加入 Joined：${joined}</p>`;
    } else if (step <= N) {
      const Q = QUESTIONS[step-1];
      app.innerHTML = `
        <div class="tag">第 ${step} 题 / ${N} · Question ${step} of ${N}</div>
        <div class="p-q">${esc(Q.zh)}<span class="en">${esc(Q.en)}</span></div>
        <div class="p-opts">${Q.o.map((o,i)=>`<div class="p-opt"><span class="letter">${LETTERS[i]}</span><div>${esc(o[0])}<span class="en">${esc(o[1])}</span></div></div>`).join("")}</div>`;
    } else if (step === STEP_RESULT) {
      const counts = {A:0,B:0,C:0,D:0}; for (const k in results) if (counts[results[k]]!==undefined) counts[results[k]]++;
      const total = count(results) || 1;
      app.innerHTML = `
        <h1>请看你的手机！<span class="en">Look at your phone!</span></h1>
        <p class="big muted">天父说，你是……<span class="en">Your Father says, you are…</span></p>
        <div class="dist">${LETTERS.map(k=>`<div class="r"><span>${RESULTS[k].ic} ${RESULTS[k].zh}</span><div class="track"><div class="fill" style="width:${Math.round(counts[k]/total*100)}%"></div></div><span>${counts[k]}</span></div>`).join("")}</div>
        <p class="note">全场统计（匿名）· Whole-room count (anonymous)</p>`;
    } else {
      app.innerHTML = `
        <h1>其实，这四个身份你全都是！<span class="en">Actually — you are all four!</span></h1>
        <div class="four">${LETTERS.map(k=>`<div><span class="ic">${RESULTS[k].ic}</span>${RESULTS[k].zh}<span class="en">${RESULTS[k].en}</span></div>`).join("")}</div>`;
    }
    const ans = (step>=1 && step<=N) ? ` · 已作答 Answered：${count(answers[step])}/${joined}` : "";
    const st = be ? (online ? "已上线 · Live" : "连接中… Connecting…") : "连接中… Connecting…";
    bar.classList.remove("hidden");
    bar.innerHTML = `
      <span class="muted">${st} · 已加入 Joined：${joined}${ans}</span>
      <span class="row">
        <button class="btn ghost" id="prev" ${step===0?"disabled":""}>← 上一步</button>
        <span class="progress">${step===0?"大厅 Lobby":step<=N?`${step}/${N}`:step===STEP_RESULT?"结果 Results":"总结 Finale"}</span>
        <button class="btn" id="next" ${step===STEP_FINAL?"disabled":""}>${step===0?"开始 Start":step===N?"显示结果 Show results":"下一步 →"}</button>
        <button class="btn ghost" id="qr" title="Show QR again">QR</button>
        <button class="btn ghost" id="reset" title="New session">新场次</button>
      </span>`;
    document.getElementById("prev").onclick = () => setStep(step-1);
    document.getElementById("next").onclick = () => setStep(step+1);
    document.getElementById("qr").onclick = () => setStep(0);
    document.getElementById("reset").onclick = newSession;
  }

  document.addEventListener("keydown", e => {
    if (e.target && e.target.tagName === "BUTTON" && (e.key === " " || e.key === "Enter")) return;
    if (["ArrowRight","PageDown"," ","Enter"].includes(e.key)) { e.preventDefault(); setStep(step+1); }
    if (["ArrowLeft","PageUp","Backspace"].includes(e.key)) { e.preventDefault(); setStep(step-1); }
  });

  render();
  try { be = await connectBackend(); } catch(e) { if (String(e && e.message) === "config") return configError(); render(); return; }
  const root = ROOT(sid);
  be.onConn(c => { online = c; render(); });
  be.watch(root + "/step", v => {
    if (!gotStep) { gotStep = true; if (Number.isInteger(v)) { step = v; render(); } else be.set(root + "/step", step); }
  });
  be.watch(root + "/p", v => { joined = count(v); render(); });
  be.watch(root + "/a", v => { answers = v || {}; render(); });
  be.watch(root + "/r", v => { results = v || {}; render(); });
}

/* ---------- participant ---------- */
async function participant(sid, solo){
  const KEY = "kq_answers_" + (sid || "solo");
  let answers = sess.get(KEY) || {};
  let pid = sess.get("kq_pid"); if (!pid) { pid = rid(10); sess.set("kq_pid", pid); }
  let step = solo ? 1 : 0, online = false, found = null, be = null, sentResult = null, slow = false;
  const root = sid ? ROOT(sid) : null;

  function save(){ sess.set(KEY, answers); }
  function choose(q, i){
    answers[q] = i; save();
    if (be) be.set(`${root}/a/${q}/${pid}`, 1);
    render();
    if (solo) setTimeout(() => { step = (q < N) ? q+1 : STEP_RESULT; render(); }, 250);
  }

  function resultHtml(){
    const r = computeResult(answers);
    if (!r) {
      return `<div class="ph">
        <h1 style="font-size:30px">你还没有作答<span class="en">You haven’t answered yet</span></h1>
        <div class="card" style="margin-top:14px">${esc(FOOTER.zh)}<div class="note">${esc(FOOTER.en)}</div></div></div>`;
    }
    if (be && sentResult !== r) { be.set(`${root}/r/${pid}`, r); sentResult = r; }
    const R = RESULTS[r];
    return `<div class="ph">
      <div class="tag">只有你看得到 · Only you can see this</div>
      <div class="result-ic" style="margin-top:14px">${R.ic}</div>
      <div class="result-name">${esc(R.zh)}</div>
      <div class="muted">${esc(R.en)}</div>
      <div class="card" style="margin-top:16px">
        <div style="font-size:19px">${esc(R.msg)}</div>
        <div class="note">${esc(R.msgEn)}</div>
        <div class="verse">${esc(R.verse)}<small>${esc(R.ref)}（和合本 CUV）</small></div>
      </div>
      <div class="card" style="margin-top:12px;text-align:center;font-size:18px">${esc(FOOTER.zh)}<div class="note">${esc(FOOTER.en)}</div></div>
    </div>`;
  }

  function render(){
    if (step === 0) {
      let msg, sub;
      if (online && found === false) { msg = "⚠️ 找不到这个场次"; sub = "This session wasn’t found — please scan the QR on the screen again."; }
      else if (online && found) { msg = "✅ 已加入！请看大屏幕，等讲员开始。"; sub = "You’re in! Watch the big screen."; }
      else { msg = "连接中… Connecting…"; sub = slow ? "如果一直连不上，可以按下面自己做。If it won’t connect, you can do it on your own below." : ""; }
      app.innerHTML = `<div class="ph">
        <div class="crown">👑</div>
        <h1 style="font-size:32px">天国身份测验<span class="en">Kingdom Identity Quiz</span></h1>
        <p class="big" style="font-size:20px">${msg}</p>
        <p class="note">${sub}</p>
        ${(online && found) ? "" : (slow ? `<button class="btn ghost" id="goSolo">自己做 · Do it on my own</button>` : "")}
      </div>`;
      const g = document.getElementById("goSolo"); if (g) g.onclick = () => { location.search = "?solo"; };
      return;
    }
    if (step >= 1 && step <= N) {
      const Q = QUESTIONS[step-1], sel = answers[step];
      app.innerHTML = `<div class="ph">
        <div class="tag">第 ${step} 题 / ${N}</div>
        <div class="ph-q">${esc(Q.zh)}<span class="en">${esc(Q.en)}</span></div>
        ${Q.o.map((o,i)=>`<button class="ph-opt ${sel===i?"sel":""}" data-i="${i}"><span class="letter">${LETTERS[i]}</span><div>${esc(o[0])}<span class="en">${esc(o[1])}</span></div></button>`).join("")}
        <p class="note">${solo ? "" : (sel!==undefined ? "✅ 已选择，可以改。等讲员下一题 · Saved — you can change it. Wait for the next question." : "选一个最像你的 · Pick the one most like you")}</p>
        ${solo && step>1 ? `<button class="btn ghost" id="back">← 上一题 Back</button>` : ""}
        ${!solo && !online ? `<p class="note">⚠️ 网络断了，重新连接中… Reconnecting…</p>` : ""}
      </div>`;
      app.querySelectorAll(".ph-opt").forEach(b => b.onclick = () => choose(step, Number(b.dataset.i)));
      const bk = document.getElementById("back"); if (bk) bk.onclick = () => { step--; render(); };
      return;
    }
    app.innerHTML = resultHtml();
  }

  render();
  if (solo) return;
  setTimeout(() => { slow = true; if (step === 0) render(); }, 10000);
  try { be = await connectBackend(); } catch(e) { if (String(e && e.message) === "config") return configError(); slow = true; render(); return; }
  be.onConn(c => { online = c; render(); });
  be.presence(`${root}/p/${pid}`);
  be.watch(`${root}/step`, v => {
    if (Number.isInteger(v)) { found = true; step = v; } else { found = false; step = 0; }
    render();
  });
}

/* ---------- route ---------- */
if (params.has("host")) presenter();
else if (params.get("join")) participant(params.get("join"), false);
else if (params.has("solo")) participant(null, true);
else landing();
</script>
